[workspace]
resolver = "3"
members = ["crates/*"]
# gui is a Tauri placeholder (phase 5): excluded from the workspace until it is built on its own.
default-members = ["crates/core", "crates/cli"]
# prototype/chaude-rs is the stream-json spike kept for reference; it has its own Cargo.lock.
exclude = ["prototype/chaude-rs", "crates/gui"]

[workspace.package]
version = "0.9.15"
edition = "2024"
publish = false

[workspace.dependencies]
# preserve_order keeps the key order of settings.json when it is rewritten.
serde_json = { version = "1", features = ["preserve_order"] }
serde = { version = "1", features = ["derive"] }
