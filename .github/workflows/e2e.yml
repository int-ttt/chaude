name: e2e

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/setup-go@v5
        with:
          go-version-file: deprecated/src/main/intt/go.mod
          cache-dependency-path: deprecated/src/main/intt/go.sum

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install claude CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Check API key secret
        id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::notice::ANTHROPIC_API_KEY 시크릿이 없어 e2e 를 건너뜁니다."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run e2e
        if: steps.key.outputs.present == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: bash tests/e2e/run.sh

      - name: Upload results
        if: steps.key.outputs.present == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: tests/e2e/results/
          if-no-files-found: ignore
