name: test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # macOS: go1.22.12 test binary of internal/harness aborts in dyld ("missing LC_UUID"); 1.23.x runs fine locally.
      - if: runner.os != 'macOS'
        uses: actions/setup-go@v5
        with:
          go-version-file: deprecated/src/main/intt/go.mod
          cache-dependency-path: deprecated/src/main/intt/go.sum
      - if: runner.os == 'macOS'
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: deprecated/src/main/intt/go.sum
      - name: Vet
        working-directory: deprecated/src/main/intt
        run: go vet ./...
      - name: Test
        working-directory: deprecated/src/main/intt
        run: go test ./... -count=1
      - name: Build
        working-directory: deprecated/src/main/intt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../../../../bin
          go build -o ../../../../bin/ ./cmd/chaude
      - name: Smoke
        shell: bash
        run: |
          set -euo pipefail
          bin=./bin/chaude
          if [ -f ./bin/chaude.exe ]; then bin=./bin/chaude.exe; fi

          # every helper script answers -h with exit 0
          for s in charcount claude-history compress-archive export-history extract-transcript search-history usage-report; do
            "$bin" "$s" -h >/dev/null 2>&1 || { echo "FAIL: $s -h"; exit 1; }
          done

          # gen-settings from repo root (default OS and each explicit OS)
          out="$RUNNER_TEMP/gen"
          mkdir -p "$out"
          "$bin" gen-settings --out "$out/default.json"
          for os in mac linux windows; do
            "$bin" gen-settings "$os" --out "$out/$os.json"
            test -s "$out/$os.json" || { echo "FAIL: empty $os settings"; exit 1; }
          done
          test -s "$out/default.json" || { echo "FAIL: empty default settings"; exit 1; }

          # charcount on BOM+CRLF fixture must match the committed expectation on every OS
          "$bin" charcount testdata/smoke/bom-crlf.md > "$out/charcount.txt"
          diff -u testdata/smoke/bom-crlf.charcount.expected "$out/charcount.txt"
          echo "smoke OK on $RUNNER_OS"
