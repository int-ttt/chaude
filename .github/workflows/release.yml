# Push a tag v<VERSION> (e.g. v0.4.11), or run this workflow by hand, to build and publish a release:
#   macOS    Claude-Lean-<ver>-mac.zip  (Claude Lean.app: native dialogs, no runtime bundled; checked, ad-hoc signed and zipped on macOS)
#   Windows  claude-lean-<ver>.exe      (C# WinForms compiled with the csc.exe that ships with Windows)
#   Terminal claude-lean-<ver>-terminal.zip (macOS/Linux: unzip, ./install.sh)
# Release notes = that version's section of CHANGELOG.md. The new release is marked Latest.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 tools/build_release.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: unix
          path: |
            dist/*-terminal.zip
            dist/NOTES.md

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 tools/build_release.py dist
      - name: Check, sign and zip Claude Lean.app
        run: |
          VER=$(cat VERSION)
          APP="dist/stage/Claude Lean.app"
          plutil -lint "$APP/Contents/Info.plist"
          bash -n "$APP/Contents/MacOS/claude-lean"
          osascript -e 'return "osascript ok"'
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --verbose=1 "$APP"
          rm -f dist/*-mac.zip
          ditto -c -k --keepParent "$APP" "Claude-Lean-$VER-mac.zip"
          ls -la Claude-Lean-*-mac.zip
      - uses: actions/upload-artifact@v4
        with: { name: mac, path: "Claude-Lean-*-mac.zip" }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python tools/build_release.py dist
      - name: Build claude-lean.exe
        shell: pwsh
        run: |
          $ver = (Get-Content VERSION -Raw).Trim()
          $fw = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319'
          & "$fw\csc.exe" /nologo /target:winexe /optimize "/out:claude-lean-$ver.exe" `
            "/resource:dist\stage\pkg-win.zip,pkg.zip" `
            /reference:System.Windows.Forms.dll /reference:System.Drawing.dll `
            "/reference:$fw\System.IO.Compression.dll" "/reference:$fw\System.IO.Compression.FileSystem.dll" `
            win\installer\Installer.cs
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-Item "claude-lean-$ver.exe" | Select-Object Name, Length
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: "claude-lean-*.exe" }

  release:
    needs: [unix, mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(cat VERSION)
          ls -la out
          gh release create "v$VER" out/*.zip out/*.exe --latest \
            --target "$GITHUB_SHA" --title "Claude Lean $VER" --notes-file out/NOTES.md \
            || gh release upload "v$VER" out/*.zip out/*.exe --clobber
