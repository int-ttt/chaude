name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: deprecated/src/main/intt/go.mod
          cache-dependency-path: deprecated/src/main/intt/go.sum
      - name: Build archives
        env:
          TARGETS: darwin/arm64 linux/amd64 linux/arm64 windows/amd64
        run: sh scripts/build-release.sh "${GITHUB_REF_NAME}"
      - name: Release notes
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          {
            if [ -n "$prev" ]; then
              echo "## Changes since ${prev}"; echo
              git log --no-merges --pretty='- %s (%h)' "${prev}..${GITHUB_REF_NAME}"
              echo; echo "Full diff: https://github.com/${GITHUB_REPOSITORY}/compare/${prev}...${GITHUB_REF_NAME}"
            else
              echo "## Initial release"
            fi
          } > dist/notes.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz dist/*.zip dist/checksums.txt \
            --title "${GITHUB_REF_NAME}" --notes-file dist/notes.md
