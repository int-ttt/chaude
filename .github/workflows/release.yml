name: release
on:
  push:
    tags: ["v*"]
  # Called by release-dispatch.yml. Tags pushed with GITHUB_TOKEN do not trigger push workflows, so the dispatcher calls this directly.
  workflow_call:
    inputs:
      tag:
        description: "Existing release tag, e.g. v1.2.3"
        required: true
        type: string
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: deprecated/src/main/intt/go.mod
          cache-dependency-path: deprecated/src/main/intt/go.sum
      - name: Build archives
        env:
          TARGETS: darwin/arm64 linux/amd64 linux/arm64 windows/amd64
        run: sh scripts/build-release.sh "${TAG}"
      - name: Release notes
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v*' "${TAG}^" 2>/dev/null || true)
          {
            if [ -n "$prev" ]; then
              echo "## Changes since ${prev}"; echo
              git log --no-merges --pretty='- %s (%h)' "${prev}..${TAG}"
              echo; echo "Full diff: https://github.com/${GITHUB_REPOSITORY}/compare/${prev}...${TAG}"
            else
              echo "## Initial release"
            fi
          } > dist/notes.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${TAG}" dist/*.tar.gz dist/*.zip dist/checksums.txt \
            --title "${TAG}" --notes-file dist/notes.md
  # Rust build for the same four targets. Artifacts only: the Go release job above stays the published release.
  rust-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: darwin
            arch: arm64
            runner: macos-latest
            target: aarch64-apple-darwin
          - os: linux
            arch: amd64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: linux
            arch: arm64
            runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: windows
            arch: amd64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install arm64 cross linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build chaude
        run: cargo build --release --locked -p chaude-cli --target "${{ matrix.target }}"
      - name: Package (unix)
        if: matrix.os != 'windows'
        shell: bash
        run: |
          version="${TAG#v}"
          mkdir -p dist-rust
          tar -C "target/${{ matrix.target }}/release" -czf "dist-rust/chaude_${version}_${{ matrix.os }}_${{ matrix.arch }}.tar.gz" chaude
      - name: Package (windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $version = $env:TAG.TrimStart('v')
          New-Item -ItemType Directory -Force -Path dist-rust | Out-Null
          Compress-Archive -Force -Path "target/${{ matrix.target }}/release/chaude.exe" -DestinationPath "dist-rust/chaude_${version}_${{ matrix.os }}_${{ matrix.arch }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: chaude-rust-${{ matrix.os }}-${{ matrix.arch }}
          path: dist-rust/*
          if-no-files-found: error
