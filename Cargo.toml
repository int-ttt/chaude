[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/core", "crates/cli"]

[workspace.package]
version = "0.11.1"
edition = "2024"
publish = false

[workspace.dependencies]
# preserve_order keeps the key order of settings.json when it is rewritten.
serde_json = { version = "1", features = ["preserve_order"] }
serde = { version = "1", features = ["derive"] }
