<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'">
<title>chaude</title>
<!--style-->
</head>
<body>
<div id="shell" class="shell">
<aside id="sidebar" class="sidebar" aria-label="Sidebar">
  <div class="sb-top">
    <button id="sidebar-toggle" type="button" class="sb-btn sb-icon" aria-expanded="true" aria-label="Collapse sidebar" title="Collapse sidebar">
      <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"/></svg>
    </button>
    <span class="sb-brand sb-text">chaude</span>
  </div>
  <button id="new-chat" type="button" class="sb-btn" title="New chat">
    <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"/></svg>
    <span class="sb-text">New chat</span>
  </button>
  <button id="open-folder" type="button" class="sb-btn" title="Open folder">
    <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M2 4.5h4l1.5 1.5H14v6.5H2z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" fill="none"/></svg>
    <span class="sb-text">Open folder</span>
  </button>
  <div class="sb-body">
    <h2 class="sb-title">Recent folders</h2>
    <ul id="recent" class="sb-list"></ul>
    <p id="recent-empty" class="sb-empty" hidden>No recent folders yet.</p>
    <h2 class="sb-title">Chats</h2>
    <ul id="chats" class="sb-list"></ul>
    <p id="chats-empty" class="sb-empty" hidden>No chats yet.</p>
  </div>
  <button id="usage" type="button" class="sb-usage" title="Usage">
    <span class="usage-line"><span class="usage-label sb-text">Session</span> <span id="usage-session" class="usage-value sb-text">--</span></span>
    <span class="usage-bar"><span id="usage-session-bar"></span></span>
    <span class="usage-line sb-text" id="usage-week-line" hidden><span class="usage-label">Week</span> <span id="usage-week" class="usage-value"></span></span>
    <span class="usage-bar" id="usage-week-track" hidden><span id="usage-week-bar"></span></span>
    <span id="usage-resets" class="usage-resets sb-text"></span>
  </button>
</aside>
<div class="main">
<section id="start" class="start" aria-label="Start" hidden>
  <h1>What can I help with?</h1>
  <div class="composer start-composer">
    <textarea id="start-input" rows="1" placeholder="Message chaude" aria-label="Message"></textarea>
    <div class="composer-actions">
      <button id="start-send" type="button" class="primary">Send</button>
    </div>
  </div>
</section>
<header id="head" class="head" hidden>
  <span id="head-mode" class="head-mode"></span>
  <span id="head-folder" class="head-folder" hidden></span>
  <span id="head-model" class="head-item"></span>
  <span id="head-context" class="head-item"></span>
  <span id="head-rate" class="head-item" hidden></span>
</header>
<main id="chat" aria-label="Conversation">
  <div id="column" class="column"></div>
</main>
<footer id="dock" class="dock">
  <button id="jump-bottom" class="jump-bottom" type="button" aria-label="Scroll to latest" title="Scroll to latest" hidden>↓</button>
  <div id="toast" class="toast" role="status" hidden></div>
  <div id="permission" class="permission" hidden>
    <div class="permission-text"><span class="permission-label">Permission needed</span> <span id="permission-text"></span></div>
    <div class="permission-actions">
      <button id="deny" type="button">Deny</button>
      <button id="allow" type="button" class="primary">Allow</button>
    </div>
  </div>
  <div class="composer">
    <textarea id="input" rows="1" placeholder="Message chaude" aria-label="Message"></textarea>
    <div class="composer-actions">
      <button id="stop" type="button" hidden>Stop</button>
      <button id="send" type="button" class="primary">Send</button>
    </div>
  </div>
</footer>
</div>
</div>
<!--vendor-->
<!--app-->
</body>
</html>
