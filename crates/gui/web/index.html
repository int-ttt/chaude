<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'">
<title>chaude</title>
<!--style-->
</head>
<body>
<main id="chat" aria-label="Conversation">
  <div id="column" class="column"></div>
</main>
<footer class="dock">
  <div id="toast" class="toast" role="status" hidden></div>
  <div id="permission" class="permission" hidden>
    <div class="permission-text"><span class="permission-label">Permission needed</span> <span id="permission-text"></span></div>
    <div class="permission-actions">
      <button id="deny" type="button">Deny</button>
      <button id="allow" type="button" class="primary">Allow</button>
    </div>
  </div>
  <div class="composer">
    <textarea id="input" rows="1" placeholder="Message chaude" aria-label="Message"></textarea>
    <div class="composer-actions">
      <button id="stop" type="button" hidden>Stop</button>
      <button id="send" type="button" class="primary">Send</button>
    </div>
  </div>
</footer>
<!--vendor-->
<!--app-->
</body>
</html>
