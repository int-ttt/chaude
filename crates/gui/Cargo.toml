[package]
name = "chaude-gui"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
# No doc tests here; keeps the cargo test summary to the one real suite.
doctest = false

[[bin]]
name = "chaude-gui"
path = "src/main.rs"
# The bin has no tests; its empty harness only adds a 0-test summary line.
test = false

[dependencies]
chaude-core = { path = "../core" }
chaude-update = { path = "../update" }
arboard = { version = "3.7", default-features = false }
notify-rust = "4.19"
serde.workspace = true
serde_json.workspace = true
tao = "0.37.2"
wry = "0.57.2"
rfd = "0.18.0"

[dev-dependencies]

# The Windows focus pipe (guard.rs) only.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Pipes"] }
