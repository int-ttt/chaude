[package]
name = "chaude-cli"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "chaude_cli"
path = "src/lib.rs"

[[bin]]
name = "chaude"
path = "src/main.rs"

[dependencies]
chaude-core = { path = "../core" }
chaude-scripts = { path = "../scripts" }
chaude-clean = { path = "../clean" }
chaude-update = { path = "../update" }
serde_json.workspace = true
crossterm = "0.29"
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
